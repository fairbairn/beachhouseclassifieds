app = "beachhouseclassifieds-image-worker"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile.worker"

[env]
  NODE_ENV = "production"

[env_bundle]
  capture_env_keys = [
    "BUNNY_STORAGE_SECRET_ACCESS_KEY",
    "HTTPS_PROXY",
    "HTTP_PROXY"
  ]

[processes]
  worker = "node dist-worker/workers/run-image-worker.js --concurrency 2"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
